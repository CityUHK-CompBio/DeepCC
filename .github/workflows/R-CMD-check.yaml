name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/r-deps.rds", version = 2)
        shell: Rscript {0}

      - name: Restore cached R packages
        if: runner.os != 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ steps.setup-r.outputs.r-version }}-${{ hashFiles('.github/r-deps.rds') }}
          restore-keys: ${{ runner.os }}-${{ steps.setup-r.outputs.r-version }}-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          while read -r cmd; do
            eval "$cmd"
          done < <(Rscript -e 'writeLines(remotes::system_requirements(command = "make", os = "ubuntu", release = "latest"))')

      - name: Install dependencies
        run: |
          if (!requireNamespace("BiocManager", quietly=TRUE)) install.packages("BiocManager")
          BiocManager::install("GSEABase", ask = FALSE)
          remotes::install_deps(dependencies = TRUE)
          remotes::install_cran("rcmdcheck")
        shell: Rscript {0}

      - name: Check
        env:
          _R_CHECK_CRAN_INCOMING_: false
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning", check_dir = "check")
        shell: Rscript {0}

      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-r${{ matrix.config.r }}-results
          path: check

  offline-cache:
    runs-on: ubuntu-latest
    name: bundled cache without optional packages
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install hard dependencies only
        run: |
          install.packages("remotes")
          remotes::install_deps(dependencies = c("Depends", "Imports", "LinkingTo"))
          remotes::install_local(".", dependencies = FALSE, upgrade = "never")
        shell: Rscript {0}

      - name: Verify bundled MSigDB cache works without msigdbr
        run: |
          Rscript -e '
            if (requireNamespace("msigdbr", quietly = TRUE)) {
              stop("msigdbr must not be installed for this check")
            }
            library(DeepCC)
            set.seed(1)
            eps <- matrix(rnorm(4 * 500), nrow = 4, ncol = 500)
            colnames(eps) <- as.character(sample(1:30000, 500))
            fs <- getFunctionalSpectra(as.data.frame(eps), scale = FALSE)
            stopifnot(ncol(fs) > 20000)
            cat("bundled cache ok:", ncol(fs), "gene sets\n")
          '
